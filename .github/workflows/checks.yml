name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: python -m pip install -r bot/requirements.txt
      - run: python -m compileall -q bot tests run_local.py judge_simulator.py
      - run: python -m unittest discover -s tests -v
